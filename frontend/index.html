<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnoGov | Public Procurement Innovation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;color:#334155;font-family:Inter,Arial,sans-serif;text-align:center">
        <div>
          <div style="width:42px;height:42px;margin:0 auto 16px;border:4px solid #2563eb;border-top-color:transparent;border-radius:50%;animation:innogov-spin .8s linear infinite"></div>
          <p style="margin:0;font-size:16px;font-weight:700">Opening InnoGov...</p>
          <p style="max-width:360px;margin:8px 0 0;font-size:13px;line-height:1.5;color:#64748b">The server may be starting for the first time. Please wait — the website will open shortly.</p>
        </div>
      </div>
    </div>
    <style>@keyframes innogov-spin { to { transform: rotate(360deg); } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
